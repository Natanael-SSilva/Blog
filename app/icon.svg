<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Fundo do círculo com gradiente esmeralda -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a4733"/>
      <stop offset="100%" stop-color="#2d6a4f"/>
    </linearGradient>
  </defs>

  <!-- Círculo base -->
  <circle cx="16" cy="16" r="15" fill="url(#bg)"/>

  <!-- Borda dourada -->
  <circle cx="16" cy="16" r="15" fill="none" stroke="#8b6914" stroke-width="1"/>

  <!-- Pena (Feather icon simplificada) em dourado -->
  <g transform="translate(9, 8)" stroke="#c9a84c" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Corpo da pena -->
    <path d="M13 1C13 1 9 3 7 7C5 11 6 14 6 14"/>
    <!-- Haste central -->
    <line x1="6" y1="14" x2="2" y2="16"/>
    <!-- Barbas superiores -->
    <line x1="9.5" y1="5" x2="6" y2="14"/>
    <!-- Barbas laterais -->
    <line x1="11" y1="3.5" x2="6" y2="14"/>
  </g>
</svg>
